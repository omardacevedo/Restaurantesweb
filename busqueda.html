<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Búsqueda de Restaurantes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="bg-light text-black py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h3 mb-0">Buscador de Restaurantes</h1>
      <a href="index.html" class="btn btn-light">Inicio</a>
    </div>
  </header>

  <main class="container">
    <!-- Barra de Búsqueda -->
    <div class="mb-4">
      <input type="text" id="buscador" class="form-control form-control-lg" placeholder="Buscar por nombre o descripción..." />
    </div>

    <!-- Contenedor de Resultados -->
    <div class="row" id="resultados"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/busqueda.js"></script>
</body>

</html>
